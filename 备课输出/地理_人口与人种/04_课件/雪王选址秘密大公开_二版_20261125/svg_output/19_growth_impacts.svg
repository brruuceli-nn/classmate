<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei, Trebuchet MS" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDFB"/>
  <rect id="deco-left-bar" data-pptx-role="decoration" x="0" y="0" width="12" height="720" fill="#1E3A8A"/>
  <rect id="deco-top-band" data-pptx-role="decoration" x="12" y="0" width="1268" height="6" fill="#E11D48"/>

  <g id="p19-header" data-pptx-bounds="56 24 1168 102">
    <rect x="56" y="24" width="268" height="30" rx="15" fill="#EFF6FF"/>
    <text x="190" y="45" font-size="16" font-weight="bold" fill="#1E3A8A" text-anchor="middle">环节三 · 人口问题辩证看</text>
    <text x="56" y="90" font-size="36" font-weight="bold" fill="#1E3A8A">除了奶茶营销，人口自然增长率对社会其他方面有何影响？</text>
    <text x="56" y="118" font-size="18" fill="#64748B">无论是人口增长过快，还是人口增长过慢，都会给资源、环境与社会经济带来严峻挑战！</text>
  </g>

  <g id="p19-too-fast" data-pptx-bounds="56 140 564 486">
    <rect x="56" y="140" width="564" height="486" rx="20" fill="#FFF5F5" stroke="#E11D48" stroke-width="2.5"/>
    <rect x="56" y="140" width="564" height="60" rx="20" fill="#E11D48"/>
    <use data-icon="tabler-filled/flame" x="82" y="154" width="32" height="32" fill="#FFFFFF"/>
    <text x="126" y="180" font-size="26" font-weight="bold" fill="#FFFFFF">人口增长过快 · 带来的问题</text>

    <rect x="84" y="226" width="508" height="110" rx="14" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5"/>
    <circle cx="134" cy="281" r="28" fill="#FFF5F5"/>
    <use data-icon="tabler-filled/car" x="116" y="263" width="36" height="36" fill="#E11D48"/>
    <text x="180" y="272" font-size="24" font-weight="bold" fill="#E11D48">1. 交通拥堵</text>
    <text x="180" y="308" font-size="18" fill="#64748B">城市道路超负荷运转，出行与物流效率受阻</text>

    <rect x="84" y="354" width="508" height="110" rx="14" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5"/>
    <circle cx="134" cy="409" r="28" fill="#FFF5F5"/>
    <use data-icon="tabler-filled/home" x="116" y="391" width="36" height="36" fill="#E11D48"/>
    <text x="180" y="400" font-size="24" font-weight="bold" fill="#E11D48">2. 住房紧张</text>
    <text x="180" y="436" font-size="18" fill="#64748B">居住空间拥挤、房价承压，基础设施资源吃紧</text>

    <rect x="84" y="482" width="508" height="110" rx="14" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5"/>
    <circle cx="134" cy="537" r="28" fill="#FFF5F5"/>
    <use data-icon="tabler-filled/briefcase" x="116" y="519" width="36" height="36" fill="#E11D48"/>
    <text x="180" y="528" font-size="24" font-weight="bold" fill="#E11D48">3. 就业压力大</text>
    <text x="180" y="564" font-size="18" fill="#64748B">新增劳动力远超岗位供给，求职竞争激烈</text>
  </g>

  <g id="p19-too-slow" data-pptx-bounds="660 140 564 486">
    <rect x="660" y="140" width="564" height="486" rx="20" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="2.5"/>
    <rect x="660" y="140" width="564" height="60" rx="20" fill="#1E3A8A"/>
    <use data-icon="tabler-filled/alert-triangle" x="686" y="154" width="32" height="32" fill="#FFFFFF"/>
    <text x="730" y="180" font-size="26" font-weight="bold" fill="#FFFFFF">人口增长过慢 · 带来的问题</text>

    <rect x="688" y="220" width="508" height="84" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <use data-icon="tabler-filled/user" x="712" y="244" width="34" height="34" fill="#1E3A8A"/>
    <text x="762" y="256" font-size="22" font-weight="bold" fill="#1E3A8A">1. 人口老龄化</text>
    <text x="762" y="286" font-size="17" fill="#64748B">老年人口比例不断攀升，青壮年劳动力短缺</text>

    <rect x="688" y="318" width="508" height="84" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <use data-icon="tabler-filled/clock" x="712" y="342" width="34" height="34" fill="#1E3A8A"/>
    <text x="762" y="354" font-size="22" font-weight="bold" fill="#1E3A8A">2. 消费活力下滑</text>
    <text x="762" y="384" font-size="17" fill="#64748B">年轻消费人群萎缩，社会整体市场需求趋缓</text>

    <rect x="688" y="416" width="508" height="84" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <use data-icon="tabler-filled/flag" x="712" y="440" width="34" height="34" fill="#1E3A8A"/>
    <text x="762" y="452" font-size="22" font-weight="bold" fill="#1E3A8A">3. 国防兵源不足</text>
    <text x="762" y="482" font-size="17" fill="#64748B">适龄青年数量减少，影响国家安全与国防建设</text>

    <rect x="688" y="514" width="508" height="84" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <use data-icon="tabler-filled/heart" x="712" y="538" width="34" height="34" fill="#1E3A8A"/>
    <text x="762" y="550" font-size="22" font-weight="bold" fill="#1E3A8A">4. 社会养老负担加重</text>
    <text x="762" y="580" font-size="17" fill="#64748B">医疗护理与养老金支出剧增，社会赡养压力沉重</text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="56 646 1168 36" fill="#64748B" font-size="14">
    <line x1="56" y1="648" x2="1224" y2="648" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="56" y="674">对应要求 PPT18 · 人口增长过快与增长过慢对社会经济各方面的影响</text>
    <text x="1224" y="674" text-anchor="end">P19 / 22</text>
  </g>
</svg>
