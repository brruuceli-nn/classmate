<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei, Trebuchet MS" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDFB"/>
  <rect id="deco-left-bar" data-pptx-role="decoration" x="0" y="0" width="12" height="720" fill="#1E3A8A"/>
  <rect id="deco-top-band" data-pptx-role="decoration" x="12" y="0" width="1268" height="6" fill="#E11D48"/>

  <g id="p16-header" data-pptx-bounds="56 28 1168 96">
    <rect x="56" y="28" width="252" height="30" rx="15" fill="#EFF6FF"/>
    <text x="182" y="49" font-size="16" font-weight="bold" fill="#1E3A8A" text-anchor="middle">环节三 · 课本核心概念</text>
    <text x="56" y="96" font-size="36" font-weight="bold" fill="#1E3A8A">课本寻宝：人口自然增长率怎么算？</text>
  </g>

  <g id="p16-formula-banner" data-pptx-bounds="56 138 1168 140">
    <rect x="56" y="138" width="1168" height="140" rx="20" fill="#1E3A8A"/>
    <text x="640" y="182" font-size="18" font-weight="bold" fill="#BFDBFE" text-anchor="middle">请在课本上找到并勾画核心公式</text>
    <text x="640" y="244" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="middle">人口自然增长率 ＝ <tspan fill="#86EFAC">出生率</tspan> − <tspan fill="#FECDD3">死亡率</tspan></text>
  </g>

  <g id="p16-three-states" data-pptx-bounds="56 300 1168 326">
    <rect x="56" y="300" width="368" height="326" rx="18" fill="#F0FDF4" stroke="#15803D" stroke-width="2.5"/>
    <rect x="84" y="326" width="312" height="54" rx="27" fill="#15803D"/>
    <text x="240" y="362" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">自然增长率 ＞ 0</text>
    <text x="84" y="428" font-size="24" font-weight="bold" fill="#15803D">人口正增长 · 总人数增加</text>
    <text x="84" y="476" font-size="20" fill="#1E293B">出生率大于死亡率，
      <tspan x="84" dy="34">总人数不断增加，此时</tspan>
      <tspan x="84" dy="34" font-weight="bold" fill="#15803D">一般年轻人较多，消费活跃！</tspan>
    </text>

    <rect x="456" y="300" width="368" height="326" rx="18" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="2.5"/>
    <rect x="484" y="326" width="312" height="54" rx="27" fill="#1E3A8A"/>
    <text x="640" y="362" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">自然增长率 ＝ 0</text>
    <text x="484" y="428" font-size="24" font-weight="bold" fill="#1E3A8A">人口零增长 · 总人数不变</text>
    <text x="484" y="476" font-size="20" fill="#1E293B">出生率恰好等于死亡率，
      <tspan x="484" dy="34">新增人数与死亡人数持平，</tspan>
      <tspan x="484" dy="34" font-weight="bold" fill="#1E3A8A">人口总规模保持稳定不变。</tspan>
    </text>

    <rect x="856" y="300" width="368" height="326" rx="18" fill="#FFF5F5" stroke="#E11D48" stroke-width="2.5"/>
    <rect x="884" y="326" width="312" height="54" rx="27" fill="#E11D48"/>
    <text x="1040" y="362" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">自然增长率 ＜ 0</text>
    <text x="884" y="428" font-size="24" font-weight="bold" fill="#E11D48">人口负增长 · 老龄化出现</text>
    <text x="884" y="476" font-size="20" fill="#1E293B">出生率小于死亡率，
      <tspan x="884" dy="34">总人数逐渐减少，伴随明显的</tspan>
      <tspan x="884" dy="34" font-weight="bold" fill="#E11D48">人口老龄化现象！</tspan>
    </text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="56 646 1168 36" fill="#64748B" font-size="14">
    <line x1="56" y1="648" x2="1224" y2="648" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="56" y="674">对应要求 PPT15 · 人口自然增长率计算公式及 ＞0 / ＝0 / ＜0 三种状态</text>
    <text x="1224" y="674" text-anchor="end">P16 / 22</text>
  </g>
</svg>
