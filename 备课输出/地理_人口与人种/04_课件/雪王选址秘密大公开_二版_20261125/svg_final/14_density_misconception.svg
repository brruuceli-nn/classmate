    <text x="144" y="186" font-size="24" font-weight="bold" fill="#1E293B">灵魂拷问：是不是只要<tspan fill="#E11D48">人口密度大</tspan>，这个国家的<tspan fill="#1E3A8A">总人口</tspan>就一定很多？</text>
    <text x="144" y="224" font-size="20" fill="#E11D48" font-weight="bold">答：不一定！千万别把“挤不挤”等同于“总人数多不多”！</text>
