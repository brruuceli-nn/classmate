<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei, Trebuchet MS" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDFB"/>
  <rect id="deco-left-bar" data-pptx-role="decoration" x="0" y="0" width="12" height="720" fill="#E11D48"/>
  <rect id="deco-top-band" data-pptx-role="decoration" x="12" y="0" width="1268" height="6" fill="#1E3A8A"/>

  <g id="p14-header" data-pptx-bounds="56 28 1168 96">
    <rect x="56" y="28" width="252" height="30" rx="15" fill="#FFF5F5" stroke="#FECDD3" stroke-width="1"/>
    <text x="182" y="49" font-size="16" font-weight="bold" fill="#E11D48" text-anchor="middle">环节二 · 易混淆概念辨析</text>
    <text x="56" y="96" font-size="36" font-weight="bold" fill="#1E3A8A">考考你：人口密度大 ＝ 国家总人口多吗？</text>
  </g>

  <g id="p14-trap-question" data-pptx-bounds="56 138 1168 106">
    <rect x="56" y="138" width="1168" height="106" rx="18" fill="#FFF5F5" stroke="#E11D48" stroke-width="2"/>
    <use data-icon="tabler-filled/alert-triangle" x="86" y="172" width="40" height="40" fill="#E11D48"/>
    <text x="144" y="186" font-size="24" font-weight="bold" fill="#1E293B">灵魂拷问：是不是只要<tspan fill="#E11D48">人口密度大</tspan>，这个国家的<tspan fill="#1E3A8A">总人口</tspan>就一定很多？</text>
    <text x="144" y="224" font-size="20" fill="#E11D48" font-weight="bold">答：不一定！千万别把“挤不挤”等同于“总人数多不多”！</text>
  </g>

  <g id="p14-formula-box" data-pptx-bounds="56 264 1168 158">
    <rect x="56" y="264" width="1168" height="158" rx="20" fill="#1E3A8A"/>
    <text x="640" y="314" font-size="20" font-weight="bold" fill="#BFDBFE" text-anchor="middle">人口密度计算公式（平均每平方千米内居住的人口数）</text>
    <text x="640" y="378" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="middle">人口密度 ＝ 总人口 ÷ 面积 <tspan font-size="24" fill="#FECDD3">（人 / 平方千米）</tspan></text>
  </g>

  <g id="p14-conclusion-split" data-pptx-bounds="56 442 1168 184">
    <rect x="56" y="442" width="564" height="184" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <use data-icon="tabler-filled/bulb" x="84" y="468" width="32" height="32" fill="#D97706"/>
    <text x="128" y="494" font-size="24" font-weight="bold" fill="#1E3A8A">举个反例秒懂：新加坡</text>
    <text x="84" y="538" font-size="20" fill="#1E293B">国土面积非常狭小，人口密度高达约 8000 人/km²，
      <tspan x="84" dy="32">但全国总人口仅约 600 万，远少于中国和印度！</tspan>
    </text>

    <rect x="648" y="442" width="576" height="184" rx="18" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
    <use data-icon="tabler-filled/circle-check" x="676" y="468" width="32" height="32" fill="#15803D"/>
    <text x="720" y="494" font-size="24" font-weight="bold" fill="#15803D">核心定论（记牢！）</text>
    <text x="676" y="538" font-size="22" font-weight="bold" fill="#1E293B">人口密度只反映人口分布的<tspan fill="#E11D48">疏密程度</tspan>，
      <tspan x="676" dy="36">绝不能直接等于<tspan fill="#1E3A8A">人口多少（总人数）</tspan>！</tspan>
    </text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="56 646 1168 36" fill="#64748B" font-size="14">
    <line x1="56" y1="648" x2="1224" y2="648" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="56" y="674">对应要求 PPT13 · 人口密度计算公式与易混淆概念辨析</text>
    <text x="1224" y="674" text-anchor="end">P14 / 22</text>
  </g>
</svg>
