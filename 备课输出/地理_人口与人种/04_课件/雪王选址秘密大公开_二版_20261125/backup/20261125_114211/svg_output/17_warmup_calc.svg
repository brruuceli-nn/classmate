    <text x="148" y="210" font-size="28" font-weight="bold" fill="#1E293B">已知某地出生率为 <tspan font-size="36" fill="#15803D">16%</tspan>，死亡率为 <tspan font-size="36" fill="#E11D48">7%</tspan>，
      <tspan x="148" dy="54">请问：该地的人口自然增长率是多少呢？人口总数怎么变化？</tspan>
