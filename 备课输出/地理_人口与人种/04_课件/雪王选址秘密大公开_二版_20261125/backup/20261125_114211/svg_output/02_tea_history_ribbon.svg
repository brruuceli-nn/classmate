    <text x="78" y="204" font-size="20" fill="#1E293B">茶叶成为中国影响世界<tspan fill="#15803D" font-weight="bold">最重要的商品之一</tspan>；
      <tspan x="78" dy="30">到 19 世纪，饮茶成为风靡全球的文化现象。</tspan>
