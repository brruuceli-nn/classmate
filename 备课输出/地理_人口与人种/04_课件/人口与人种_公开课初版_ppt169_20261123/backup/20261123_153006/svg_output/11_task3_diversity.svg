<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei, Arial" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <rect id="deco-top-bar" data-pptx-role="decoration" x="0" y="0" width="1280" height="8" fill="#0F766E"/>

  <g id="page-header" data-pptx-bounds="60 28 1160 76">
    <text x="60" y="66" font-size="33" font-weight="bold" fill="#0F172A">破除迷思：为什么美、巴门店门口各色顾客同排队？</text>
    <text x="60" y="98" font-size="18" fill="#475569">打破“一个大洲只住一种人”的刻板印象，用历史人口迁移理解多元共居</text>
  </g>

  <g id="photo-placeholder-americas" data-pptx-bounds="60 128 480 518">
    <rect x="60" y="128" width="480" height="518" rx="18" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8,5"/>
    <use data-icon="tabler-filled/photo" x="268" y="180" width="64" height="64" fill="#0F766E"/>
    <text x="300" y="286" font-size="22" font-weight="bold" fill="#1E3A8A" text-anchor="middle">【圣保罗 / 洛杉矶门店排队占位框】</text>
    <text x="300" y="334" font-size="17" fill="#334155" text-anchor="middle">此处放置：2025.12 美国洛杉矶首店
      <tspan x="300" dy="30">或 2026.04 巴西圣保罗首店实拍照片</tspan>
      <tspan x="300" dy="30">（黄、白、黑及混血年轻顾客同框排队）</tspan>
    </text>
    <rect x="96" y="472" width="408" height="128" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="300" y="512" font-size="18" font-weight="bold" fill="#DC2626" text-anchor="middle">现场追问</text>
    <text x="300" y="546" font-size="17" fill="#0F172A" text-anchor="middle">“都在美洲开店，为什么同一家店门口</text>
    <text x="300" y="576" font-size="17" fill="#0F172A" text-anchor="middle">各种肤色的年轻人都能遇到？”</text>
  </g>

  <g id="myth-step-1" data-pptx-bounds="568 128 652 146">
    <rect x="568" y="128" width="652" height="146" rx="16" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2"/>
    <text x="598" y="168" font-size="21" font-weight="bold" fill="#B45309">1. 打破“一洲只住一种人”的刻板印象</text>
    <text x="598" y="206" font-size="18" fill="#334155">受历史发展与现代交通影响，世界各大人种之间存在大范围迁移与融合，
      <tspan x="598" dy="30">几乎每个大洲都生活着多种人种（尤其是北美洲与南美洲）。</tspan>
    </text>
  </g>

  <g id="myth-step-2" data-pptx-bounds="568 294 652 192">
    <rect x="568" y="294" width="652" height="192" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    <text x="598" y="334" font-size="21" font-weight="bold" fill="#1E3A8A">2. 用“历史人口迁移”解释美洲多元肤色</text>
    <text x="598" y="372" font-size="18" fill="#0F172A">• 美洲原住民（印第安人）：属于<tspan font-weight="bold" fill="#B45309">黄色人种</tspan>
      <tspan x="598" dy="32">• 近代殖民与移民：大量欧洲<tspan font-weight="bold" fill="#1E3A8A">白色人种</tspan>迁入定居</tspan>
      <tspan x="598" dy="32">• 历史奴隶贸易：大量非洲<tspan font-weight="bold" fill="#0F766E">黑色人种</tspan>被贩卖至美洲</tspan>
      <tspan x="598" dy="32">→ 长期通婚融合，形成如今巴西、美国等<tspan font-weight="bold" fill="#DC2626">多元人种共居</tspan>格局</tspan>
    </text>
  </g>

  <g id="myth-step-3" data-pptx-bounds="568 506 652 140">
    <rect x="568" y="506" width="652" height="140" rx="16" fill="#15803D"/>
    <use data-icon="tabler-filled/circle-check" x="598" y="534" width="38" height="38" fill="#FFFFFF"/>
    <text x="648" y="560" font-size="22" font-weight="bold" fill="#FFFFFF">3. 价值观升华：人种无高低，各美其美</text>
    <text x="598" y="602" font-size="18" fill="#DCFCE7">三大人种的体质差异仅体现对自然环境的适应，绝无优劣之分。
      <tspan x="598" dy="28" font-weight="bold" fill="#FFFFFF">世界各民族、各人种一律平等，全球门店微笑服务每一位顾客！</tspan>
    </text>
  </g>

  <g id="page-footer" data-pptx-bounds="60 672 1160 28" font-size="14" fill="#64748B">
    <text x="60" y="692">课标落点：理解人种分布与历史人口迁移的关系，树立各民族、各人种一律平等的观念</text>
    <text x="1220" y="692" text-anchor="end">第 11 页 / 共 14 页</text>
  </g>
</svg>
