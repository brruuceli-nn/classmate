<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei, Arial" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <rect id="deco-top-bar" data-pptx-role="decoration" x="0" y="0" width="1280" height="8" fill="#15803D"/>

  <g id="page-header" data-pptx-bounds="60 28 1160 76">
    <text x="60" y="66" font-size="33" font-weight="bold" fill="#0F172A">结课实践：提交《雪王下一站选址评估微报告》</text>
    <rect x="995" y="34" width="225" height="36" rx="18" fill="#DCFCE7"/>
    <text x="1107" y="58" font-size="16" font-weight="bold" fill="#15803D" text-anchor="middle">结课出门条 · 3 分钟</text>
    <text x="60" y="98" font-size="18" fill="#475569">目标预设：雪王总部拟下一步开拓“非洲沿海人口稠密大城市”（或自选目标站），请完成 3 项终审评估</text>
  </g>

  <g id="exit-report-card" data-pptx-bounds="60 126 730 524">
    <rect x="60" y="126" width="730" height="524" rx="18" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2.5"/>
    <rect x="60" y="126" width="730" height="54" rx="18" fill="#15803D"/>
    <use data-icon="tabler-filled/clipboard-check" x="86" y="137" width="32" height="32" fill="#FFFFFF"/>
    <text x="130" y="161" font-size="21" font-weight="bold" fill="#FFFFFF">《雪王下一站选址评估微报告》（调研员终审卡）</text>

    <rect x="86" y="198" width="678" height="132" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="108" y="232" font-size="19" font-weight="bold" fill="#1E3A8A">① 人口分布与地形气候条件（选“密”避“疏”）</text>
    <text x="108" y="268" font-size="17" fill="#334155">该区域地形以 ________ 为主，气候 ________，属于世界人口 ________
      <tspan x="108" dy="30">（稠密 / 稀疏）区，能够满足门店开店所需的 ________ 条件。</tspan>
    </text>

    <rect x="86" y="346" width="678" height="132" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="108" y="380" font-size="19" font-weight="bold" fill="#DC2626">② 人口增长与劳动力隐患提示（看“增”防“老”）</text>
    <text x="108" y="416" font-size="17" fill="#334155">当地人口自然增长率 ________（较高 / 负增长），潜在优势是 ________；
      <tspan x="108" dy="30">但总部运营时需提前预防 ________ 等人口相关隐患。</tspan>
    </text>

    <rect x="86" y="494" width="678" height="132" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="108" y="528" font-size="19" font-weight="bold" fill="#0F766E">③ 主要人种与人文尊重提示（识“貌”知“源”）</text>
    <text x="108" y="564" font-size="17" fill="#334155">当地主要分布 ________ 人种（或多元人种共居），
      <tspan x="108" dy="30">门店迎客服务与尊重差异提示：________________________。</tspan>
    </text>
  </g>

  <g id="peer-review-placeholder" data-pptx-bounds="814 126 406 320">
    <rect x="814" y="126" width="406" height="320" rx="16" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>
    <use data-icon="tabler-filled/photo" x="996" y="152" width="42" height="42" fill="#1E3A8A"/>
    <text x="1017" y="224" font-size="20" font-weight="bold" fill="#1E3A8A" text-anchor="middle">【学生微报告投影互评区】</text>
    <text x="842" y="264" font-size="16" fill="#334155">课堂投影展示 1–2 份学生手写微报告，
      <tspan x="842" dy="26">全班对照以下 3 项标准快速打星互评：</tspan>
      <tspan x="842" dy="34" font-weight="bold" fill="#15803D">★ 分布地形气候理由准确</tspan>
      <tspan x="842" dy="28" font-weight="bold" fill="#DC2626">★ 增长率趋势与隐患逻辑匹配</tspan>
      <tspan x="842" dy="28" font-weight="bold" fill="#0F766E">★ 体现人种平等与人文尊重</tspan>
    </text>
  </g>

  <g id="next-lesson-preview" data-pptx-bounds="814 466 406 184">
    <rect x="814" y="466" width="406" height="184" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    <text x="840" y="506" font-size="20" font-weight="bold" fill="#1E3A8A">下节预告：《多样的文化》</text>
    <text x="840" y="544" font-size="16" fill="#334155">人找对了，店开起来了，文化怎么适配？
      <tspan x="840" dy="28">• 为什么印尼门店必须做清真认证？</tspan>
      <tspan x="840" dy="28">• 为什么巴西门店会本土化调整甜度与口味？</tspan>
      <tspan x="840" dy="28" font-weight="bold" fill="#1E3A8A">敬请期待第五章第二节！</tspan>
    </text>
  </g>

  <g id="page-footer" data-pptx-bounds="60 672 1160 28" font-size="14" fill="#64748B">
    <text x="60" y="692">堂清检测（Exit Ticket）：用一份三问微报告实现全课首尾闭环</text>
    <text x="1220" y="692" text-anchor="end">第 12 页 / 共 14 页</text>
  </g>
</svg>
