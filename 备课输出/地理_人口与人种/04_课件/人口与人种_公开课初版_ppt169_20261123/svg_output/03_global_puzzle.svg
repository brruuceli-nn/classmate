<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei, Arial" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <rect id="deco-top-bar" data-pptx-role="decoration" x="0" y="0" width="1280" height="8" fill="#1E3A8A"/>

  <g id="page-header" data-pptx-bounds="60 30 1160 80">
    <text x="60" y="70" font-size="34" font-weight="bold" fill="#0F172A">导入：雪王的全球谜题——门店分布为何冷热不均？</text>
    <rect x="1030" y="38" width="190" height="38" rx="19" fill="#DBEAFE"/>
    <text x="1125" y="63" font-size="17" font-weight="bold" fill="#1E3A8A" text-anchor="middle">导入 · 读图任务 1</text>
    <text x="60" y="102" font-size="18" fill="#475569">2024–2026 真实公开门店数据对比（仅作课堂地理情境引入）</text>
  </g>

  <g id="kpi-domestic" data-pptx-bounds="60 130 285 170">
    <rect x="60" y="130" width="285" height="170" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="84" y="164" font-size="17" font-weight="bold" fill="#475569">国内大本营</text>
    <text x="84" y="216" font-size="38" font-weight="bold" fill="#1E3A8A">近 6 万家</text>
    <text x="84" y="254" font-size="16" fill="#334155">国内市场趋于饱和，
      <tspan x="84" dy="24">加速寻找海外新增量</tspan>
    </text>
  </g>

  <g id="kpi-sea" data-pptx-bounds="365 130 295 170">
    <rect x="365" y="130" width="295" height="170" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
    <text x="389" y="164" font-size="17" font-weight="bold" fill="#B91C1C">海外集中在东南亚</text>
    <text x="389" y="216" font-size="38" font-weight="bold" fill="#DC2626">4,467 家</text>
    <text x="389" y="252" font-size="16" fill="#334155">2018.09 越南河内首店；
      <tspan x="389" dy="24">印尼约 2,667、越南约 1,304 家</tspan>
    </text>
  </g>

  <g id="kpi-japan" data-pptx-bounds="60 318 285 182">
    <rect x="60" y="318" width="285" height="182" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2"/>
    <text x="84" y="352" font-size="17" font-weight="bold" fill="#B45309">高收入 / 老龄化市场遇冷</text>
    <text x="84" y="404" font-size="38" font-weight="bold" fill="#D97706">3 年仅 4 家</text>
    <text x="84" y="442" font-size="16" fill="#334155">日本东京同样人口稠密，
      <tspan x="84" dy="24">为何扩张远低于预期？</tspan>
    </text>
  </g>

  <g id="kpi-americas" data-pptx-bounds="365 318 295 182">
    <rect x="365" y="318" width="295" height="182" rx="14" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
    <text x="389" y="350" font-size="17" font-weight="bold" fill="#15803D">跨洲新落点（15–16 国）</text>
    <text x="389" y="394" font-size="32" font-weight="bold" fill="#15803D">美 · 墨 · 巴</text>
    <text x="389" y="428" font-size="16" fill="#334155">2025.12 美国洛杉矶首店
      <tspan x="389" dy="24">2026 初墨西哥首店</tspan>
      <tspan x="389" dy="24">2026.04 巴西圣保罗（约2.1亿人）</tspan>
    </text>
  </g>

  <g id="map-placeholder-world" data-pptx-bounds="685 130 535 370">
    <rect x="685" y="130" width="535" height="370" rx="16" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8,5"/>
    <use data-icon="tabler-filled/globe" x="924" y="160" width="56" height="56" fill="#1E3A8A"/>
    <text x="952" y="250" font-size="22" font-weight="bold" fill="#1E3A8A" text-anchor="middle">【标准世界地图与海外门店占位框】</text>
    <text x="952" y="294" font-size="17" fill="#334155" text-anchor="middle">此处放置：自然资源部标准世界政区图 / 教材世界图
      <tspan x="952" dy="30">标出东南亚密集区（印尼/越南/马/泰）、日本、澳、美墨巴</tspan>
      <tspan x="952" dy="30">及大片“零门店”空白区（可附 1–2 张海外门店实拍图）</tspan>
    </text>
    <rect x="735" y="416" width="435" height="56" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="952" y="450" font-size="16" font-weight="bold" fill="#DC2626" text-anchor="middle">版图安全提示：严禁自绘含国界线的世界地图</text>
  </g>

  <g id="reading-task-1" data-pptx-bounds="60 518 1160 132">
    <rect x="60" y="518" width="1160" height="132" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    <use data-icon="tabler-filled/compass" x="88" y="540" width="40" height="40" fill="#1E3A8A"/>
    <text x="142" y="568" font-size="22" font-weight="bold" fill="#1E3A8A">【读图任务 1】圈出“密集区”与“空白区”</text>
    <text x="88" y="608" font-size="19" fill="#0F172A">1. 观察标准世界地图上“雪王海外主要分布国”的位置，用红笔圈出密集区，蓝笔圈出空白区。
      <tspan x="88" dy="30" font-weight="bold" fill="#DC2626">2. 核心追问：为什么同样想出海赚钱，门店分布冷热这么不均？今天用“地理四把尺”来破案！</tspan>
    </text>
  </g>

  <g id="page-footer" data-pptx-bounds="60 672 1160 28" font-size="14" fill="#64748B">
    <text x="60" y="692">数据来源：东财/招商证券研报（2024.09 约4,800家→2025年底调改后4,467家；马约337/泰约272）、钛媒体/新华网/新京报 2025–2026</text>
    <text x="1220" y="692" text-anchor="end">第 3 页 / 共 14 页</text>
  </g>
