  <g id="tier1-rule" data-pptx-bounds="60 258 566 286">
    <rect x="60" y="258" width="566" height="286" rx="16" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>
    <rect x="60" y="258" width="566" height="44" rx="16" fill="#15803D"/>
    <text x="84" y="287" font-size="19" font-weight="bold" fill="#FFFFFF">第 1 阶（找位置·归纳）：世界人口“四密”与“四疏”</text>

    <text x="84" y="330" font-size="17" font-weight="bold" fill="#15803D">“四密”（中低纬沿海平原，自然+人文双优）：</text>
    <text x="84" y="358" font-size="16" fill="#0F172A">① 亚洲东部　② 亚洲南部　③ 欧洲西部　④ 北美洲东部</text>

    <line x1="84" y1="380" x2="602" y2="380" stroke="#E2E8F0" stroke-width="1.5"/>

    <text x="84" y="408" font-size="17" font-weight="bold" fill="#DC2626">“四疏”（极端自然条件，人烟稀少）：</text>
    <text x="84" y="438" font-size="16" fill="#334155">① 极端干旱沙漠（撒哈拉）　② 过于湿热雨林（亚马孙）
      <tspan x="84" dy="28">③ 终年严寒高纬（格陵兰）　④ 地势高峻高原（青藏高原）</tspan>
      <tspan x="84" dy="34" font-weight="bold" fill="#1E3A8A">小组口诀：中低纬＋沿海＋平原＋温润 → 密！四极 → 疏！</tspan>
    </text>
  </g>

  <g id="tier2-contrast" data-pptx-bounds="654 258 566 286">
    <rect x="654" y="258" width="566" height="286" rx="16" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
    <rect x="654" y="258" width="566" height="44" rx="16" fill="#DC2626"/>
    <text x="678" y="287" font-size="19" font-weight="bold" fill="#FFFFFF">第 2 阶（深层破迷思·小组辨析）：为何同要素却反差？</text>

    <rect x="676" y="316" width="522" height="100" rx="10" fill="#FEF2F2"/>
    <text x="694" y="344" font-size="17" font-weight="bold" fill="#B91C1C">反差 A（同为平原）：亚洲东部平原 vs 亚马孙平原</text>
    <text x="694" y="374" font-size="16" fill="#334155">都是平坦大平原，为什么一个人口稠密、一个几乎无人？
      <tspan x="694" dy="26" font-weight="bold" fill="#0F172A">→ 关键卡尺：气候！亚马孙终年过于湿热，不适宜人居。</tspan>
    </text>

    <rect x="676" y="428" width="522" height="100" rx="10" fill="#EFF6FF"/>
    <text x="694" y="456" font-size="17" font-weight="bold" fill="#1E3A8A">反差 B（同处中低纬）：东南亚沿海 vs 撒哈拉沙漠</text>
    <text x="694" y="486" font-size="16" fill="#334155">纬度相近阳光都足，为什么印尼开 2,667 家而撒哈拉零门店？
      <tspan x="694" dy="26" font-weight="bold" fill="#0F172A">→ 关键卡尺：海陆与降水！沙漠极端干旱、无水源与客流。</tspan>
    </text>
  </g>

  <g id="tier3-transfer" data-pptx-bounds="60 560 1160 94">
    <rect x="60" y="560" width="1160" height="94" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <use data-icon="tabler-filled/compass" x="86" y="586" width="38" height="38" fill="#1E3A8A"/>
    <text x="138" y="598" font-size="19" font-weight="bold" fill="#1E3A8A">第 3 阶（区域认知强迁移）：巴西和美国也是雪王新市场，店会开在亚马孙雨林里吗？</text>
    <text x="138" y="632" font-size="17" fill="#0F172A">小组推演：为什么雪王 2025–2026 年精准落子<tspan font-weight="bold" fill="#DC2626">巴西圣保罗</tspan>和<tspan font-weight="bold" fill="#DC2626">美国洛杉矶</tspan>这些沿海平原大城市？（写 2 条因果链）</text>
  </g>

  <g id="page-footer" data-pptx-bounds="60 672 1160 28" font-size="14" fill="#64748B">
    <text x="60" y="692">活动③落点：三阶层层深入（找位置→辩反差→迁移选址），攻克“单看地形不看气候”易错点</text>
    <text x="1220" y="692" text-anchor="end">第 6 页 / 共 14 页</text>
  </g>
</svg>
