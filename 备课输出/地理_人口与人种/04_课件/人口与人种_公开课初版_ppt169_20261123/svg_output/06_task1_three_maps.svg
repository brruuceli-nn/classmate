<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei, Arial" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <rect id="deco-top-bar" data-pptx-role="decoration" x="0" y="0" width="1280" height="8" fill="#2563EB"/>

  <g id="page-header" data-pptx-bounds="60 26 1160 72">
    <text x="60" y="64" font-size="32" font-weight="bold" fill="#0F172A">任务一（2）：四密四疏重点突破——三阶小组深度探究</text>
    <rect x="920" y="32" width="300" height="36" rx="18" fill="#DBEAFE"/>
    <text x="1070" y="56" font-size="16" font-weight="bold" fill="#1E3A8A" text-anchor="middle">小组活动③ · 由浅入深（8 分钟）</text>
    <text x="60" y="92" font-size="17" fill="#475569">第 1 阶：三图叠加找规律 → 第 2 阶：同地形/同纬度反差辨析 → 第 3 阶：巴西圣保罗/美国洛杉矶迁移裁定</text>
  </g>

  <g id="three-maps-strip" data-pptx-bounds="60 112 1160 140">
    <rect x="60" y="112" width="340" height="106" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>
    <use data-icon="tabler-filled/user" x="78" y="126" width="28" height="28" fill="#1E3A8A"/>
    <text x="114" y="146" font-size="18" font-weight="bold" fill="#1E3A8A">图 1：《世界人口分布图》</text>
    <text x="78" y="178" font-size="15" fill="#334155">【原图占位】圈出 &gt;100 与 &lt;1 人/km²</text>

    <g id="p06-plus-1" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="mathPlus" data-pptx-frame="414 158 34 34" fill="#1E3A8A" stroke="none">
    <path d="M 418.51 171 L 427 171 L 427 162.51 L 435 162.51 L 435 171 L 443.49 171 L 443.49 179 L 435 179 L 435 187.49 L 427 187.49 L 427 179 L 418.51 179 Z"/>
    </g>

    <rect x="464" y="112" width="340" height="106" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>
    <use data-icon="tabler-filled/mountain" x="482" y="126" width="28" height="28" fill="#15803D"/>
    <text x="518" y="146" font-size="18" font-weight="bold" fill="#15803D">图 2：《世界地形图》</text>
    <text x="482" y="178" font-size="15" fill="#334155">【原图占位】比对沿海平原 vs 高原</text>

    <g id="p06-plus-2" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="mathPlus" data-pptx-frame="818 158 34 34" fill="#1E3A8A" stroke="none">
    <path d="M 822.51 171 L 831 171 L 831 162.51 L 839 162.51 L 839 171 L 847.49 171 L 847.49 179 L 839 179 L 839 187.49 L 831 187.49 L 831 179 L 822.51 179 Z"/>
    </g>

    <rect x="868" y="112" width="352" height="106" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>
    <use data-icon="tabler-filled/sun" x="886" y="126" width="28" height="28" fill="#D97706"/>
    <text x="922" y="146" font-size="18" font-weight="bold" fill="#B45309">图 3：《世界气候图》</text>
    <text x="886" y="178" font-size="15" fill="#334155">【原图占位】比对温润 vs 干/湿热/寒</text>

    <g id="p06-arr-down" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="downArrow" data-pptx-frame="618 224 44 28" fill="#1E3A8A" stroke="none">
    <path d="M 618 238 L 629 238 L 629 224 L 651 224 L 651 238 L 662 238 L 640 252 Z"/>
