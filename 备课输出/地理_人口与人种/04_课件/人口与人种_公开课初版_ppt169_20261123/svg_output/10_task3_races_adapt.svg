<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei, Arial" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <rect id="deco-top-bar" data-pptx-role="decoration" x="0" y="0" width="1280" height="8" fill="#0F766E"/>

  <g id="page-header" data-pptx-bounds="60 28 1160 76">
    <text x="60" y="66" font-size="33" font-weight="bold" fill="#0F172A">任务三：识“貌”知“源”——全球雪王《迎客指南》人种档案</text>
    <rect x="995" y="34" width="225" height="36" rx="18" fill="#CCFBF1"/>
    <text x="1107" y="58" font-size="16" font-weight="bold" fill="#0F766E" text-anchor="middle">任务三 · 共 6 分钟</text>
    <text x="60" y="98" font-size="18" fill="#475569">对照《世界三大人种分布图》与太阳辐射/气候带，连线解释人种体质特征对自然环境的适应</text>
  </g>

  <g id="races-map-placeholder" data-pptx-bounds="60 120 1160 126">
    <rect x="60" y="120" width="1160" height="126" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>
    <use data-icon="tabler-filled/photo" x="88" y="140" width="38" height="38" fill="#0F766E"/>
    <text x="140" y="164" font-size="20" font-weight="bold" fill="#1E3A8A">【三大人种照片 &amp; 《世界三大人种分布图》占位示意框】</text>
    <text x="140" y="196" font-size="16" fill="#334155">左侧可放置教材三大人种代表人物肖像图；右侧放置 2024 人教版教材《世界三大人种分布图》原图
      <tspan x="140" dy="26">（严禁自绘含国界线的世界地图 · 用于读图说出三大人种主要分布地区）</tspan>
    </text>
  </g>

  <g id="race-yellow" data-pptx-bounds="60 264 370 302">
    <rect x="60" y="264" width="370" height="302" rx="16" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2"/>
    <rect x="60" y="264" width="370" height="48" rx="16" fill="#D97706"/>
    <text x="245" y="296" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">黄色人种</text>
    <text x="84" y="344" font-size="17" fill="#0F172A"><tspan font-weight="bold" fill="#B45309">• 体质特征：</tspan>皮肤呈淡黄色，头发黑直，
      <tspan x="84" dy="26">  面庞扁平，体毛中等。</tspan>
      <tspan x="84" dy="34"><tspan font-weight="bold" fill="#B45309">• 主要分布：</tspan>亚洲东部（及美洲印第安</tspan>
      <tspan x="84" dy="26">  人、北冰洋沿岸因纽特人）。</tspan>
      <tspan x="84" dy="34"><tspan font-weight="bold" fill="#15803D">• 环境适应：</tspan>适应温带过渡气候与</tspan>
      <tspan x="84" dy="26">  太阳辐射环境。</tspan>
    </text>
  </g>

  <g id="race-white" data-pptx-bounds="455 264 370 302">
    <rect x="455" y="264" width="370" height="302" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    <rect x="455" y="264" width="370" height="48" rx="16" fill="#2563EB"/>
    <text x="640" y="296" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">白色人种</text>
    <text x="479" y="344" font-size="17" fill="#0F172A"><tspan font-weight="bold" fill="#1E3A8A">• 体质特征：</tspan>肤色多呈浅淡色，发色
      <tspan x="479" dy="26">  较浅呈波状，鼻梁高，体毛较多。</tspan>
      <tspan x="479" dy="34"><tspan font-weight="bold" fill="#1E3A8A">• 主要分布：</tspan>欧洲、北美洲、大洋洲、</tspan>
      <tspan x="479" dy="26">  亚洲西部与南部、非洲北部。</tspan>
      <tspan x="479" dy="34"><tspan font-weight="bold" fill="#15803D">• 环境适应：</tspan>光照较弱区利于吸收</tspan>
      <tspan x="479" dy="26">  紫外线；高窄鼻腔预热冷空气。</tspan>
    </text>
  </g>

  <g id="race-black" data-pptx-bounds="850 264 370 302">
    <rect x="850" y="264" width="370" height="302" rx="16" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
    <rect x="850" y="264" width="370" height="48" rx="16" fill="#0F766E"/>
    <text x="1035" y="296" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">黑色人种</text>
    <text x="874" y="344" font-size="17" fill="#0F172A"><tspan font-weight="bold" fill="#0F766E">• 体质特征：</tspan>肤色黝黑，头发卷曲，
      <tspan x="874" dy="26">  嘴唇较厚，体毛很少。</tspan>
      <tspan x="874" dy="34"><tspan font-weight="bold" fill="#0F766E">• 主要分布：</tspan>非洲中部和南部（及大</tspan>
      <tspan x="874" dy="26">  洋洲部分地区、历史迁往美洲）。</tspan>
      <tspan x="874" dy="34"><tspan font-weight="bold" fill="#15803D">• 环境适应：</tspan>黑色素防强紫外线；</tspan>
      <tspan x="874" dy="26">  卷发隔热、宽鼻厚唇利于散热。</tspan>
    </text>
  </g>

  <g id="matching-prompt" data-pptx-bounds="60 584 1160 68">
    <rect x="60" y="584" width="1160" height="68" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <use data-icon="tabler-filled/sun" x="88" y="600" width="36" height="36" fill="#D97706"/>
    <text x="138" y="625" font-size="19" font-weight="bold" fill="#0F172A">【课堂连线活动】请把“肤色/毛发/鼻形特征”与“太阳辐射强弱、高纬寒冷/低纬炎热气候”连线配对！</text>
  </g>

  <g id="page-footer" data-pptx-bounds="60 672 1160 28" font-size="14" fill="#64748B">
    <text x="60" y="692">科学认识：人种划分主要依据外貌体质特征，是人类长期适应不同自然环境的结果</text>
    <text x="1220" y="692" text-anchor="end">第 10 页 / 共 14 页</text>
  </g>
</svg>
