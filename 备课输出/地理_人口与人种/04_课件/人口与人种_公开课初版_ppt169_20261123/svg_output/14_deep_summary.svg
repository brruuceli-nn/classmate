<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei, Arial" data-pptx-page-role="ending">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <rect id="deco-top-bar" data-pptx-role="decoration" x="0" y="0" width="1280" height="8" fill="#15803D"/>

  <g id="page-header" data-pptx-bounds="60 28 1160 76">
    <text x="60" y="66" font-size="33" font-weight="bold" fill="#0F172A">总结深化：跳出雪王选址，学会用地理眼光看世界</text>
    <rect x="975" y="34" width="245" height="36" rx="18" fill="#DCFCE7"/>
    <text x="1097" y="58" font-size="16" font-weight="bold" fill="#15803D" text-anchor="middle">课堂收官 · 思维跃迁</text>
    <text x="60" y="98" font-size="18" fill="#475569">从一节《人口与人种》出发，提炼可迁移终身的区域分析方法、国情视野与人文价值观</text>
  </g>

  <g id="deep-tier-1" data-pptx-bounds="60 128 352 380">
    <rect x="60" y="128" width="352" height="380" rx="16" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
    <rect x="60" y="128" width="352" height="54" rx="16" fill="#1E3A8A"/>
    <text x="236" y="163" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">一、方法深化：四步读图法</text>
    <use data-icon="tabler-filled/compass" x="214" y="196" width="44" height="44" fill="#1E3A8A"/>
    <text x="86" y="272" font-size="17" font-weight="bold" fill="#1E3A8A">不仅选门店，更能分析任何区域：</text>
    <text x="86" y="308" font-size="16" fill="#334155">1. <tspan font-weight="bold" fill="#0F172A">看位置</tspan>：圈定经纬度与海陆轮廓
      <tspan x="86" dy="34">2. <tspan font-weight="bold" fill="#0F172A">叠要素</tspan>：地形＋气候交叉验证</tspan>
      <tspan x="86" dy="34">3. <tspan font-weight="bold" fill="#0F172A">算动态</tspan>：看增长率正负与年龄结构</tspan>
      <tspan x="86" dy="34">4. <tspan font-weight="bold" fill="#0F172A">察人文</tspan>：尊重人种分布与历史迁移</tspan>
      <tspan x="86" dy="40" font-weight="bold" fill="#2563EB">→ 从“背地名”升级为“析因果”</tspan>
    </text>
  </g>

  <g id="p14-arr-1-wrap" data-pptx-bounds="422 280 36 36">
    <g id="p14-arr-1" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="rightArrow" data-pptx-frame="422 280 36 36" fill="#1E3A8A" stroke="none">
    <path d="M 422 289 L 440 289 L 440 280 L 458 298 L 440 316 L 440 307 L 422 307 Z"/>
    </g>
  </g>

  <g id="deep-tier-2" data-pptx-bounds="468 128 344 380">
    <rect x="468" y="128" width="344" height="380" rx="16" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
    <rect x="468" y="128" width="344" height="54" rx="16" fill="#DC2626"/>
    <text x="640" y="163" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">二、国情深化：动态人口观</text>
    <use data-icon="tabler-filled/scale" x="618" y="196" width="44" height="44" fill="#DC2626"/>
    <text x="494" y="272" font-size="17" font-weight="bold" fill="#B91C1C">人口政策随国情动态调整：</text>
    <text x="494" y="308" font-size="16" fill="#334155">• 发展中快速增长国：稳增长、强基建
      <tspan x="494" dy="34">• 高龄负增长国：促生育、发展银发经济</tspan>
      <tspan x="494" dy="34">• <tspan font-weight="bold" fill="#DC2626">回望中国</tspan>：正从“人口数量红利”</tspan>
      <tspan x="494" dy="26">  迈向“人才素质与银发经济并行”</tspan>
      <tspan x="494" dy="40" font-weight="bold" fill="#B91C1C">→ 没有万能人口数，只有动态平衡</tspan>
    </text>
  </g>

  <g id="p14-arr-2-wrap" data-pptx-bounds="822 280 36 36">
    <g id="p14-arr-2" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="rightArrow" data-pptx-frame="822 280 36 36" fill="#15803D" stroke="none">
    <path d="M 822 289 L 840 289 L 840 280 L 858 298 L 840 316 L 840 307 L 822 307 Z"/>
    </g>
  </g>

  <g id="deep-tier-3" data-pptx-bounds="868 128 352 380">
    <rect x="868" y="128" width="352" height="380" rx="16" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>
    <rect x="868" y="128" width="352" height="54" rx="16" fill="#15803D"/>
    <text x="1044" y="163" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">三、价值深化：文明互鉴观</text>
    <use data-icon="tabler-filled/globe" x="1022" y="196" width="44" height="44" fill="#15803D"/>
    <text x="894" y="272" font-size="17" font-weight="bold" fill="#15803D">从中国品牌出海看人类命运共同体：</text>
    <text x="894" y="308" font-size="16" fill="#334155">• 肤色体貌源于自然适应，绝无高下
      <tspan x="894" dy="34">• 尊重每一处风土（语言/习俗/饮食）</tspan>
      <tspan x="894" dy="34">• 真正走得远的全球品牌，既算地理</tspan>
      <tspan x="894" dy="26">  客观账，更懂文化共情与平等尊重</tspan>
      <tspan x="894" dy="40" font-weight="bold" fill="#15803D">→ 各美其美，美美与共</tspan>
    </text>
  </g>

  <g id="deep-takeaway" data-pptx-bounds="60 528 1160 122">
    <rect x="60" y="528" width="1160" height="122" rx="18" fill="#1E3A8A"/>
    <text x="640" y="574" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">今日课后思辨任务：下回走进任何一家国际连锁店，请试着说出它背后的“地理密码”！</text>
    <text x="640" y="616" font-size="18" fill="#DBEAFE" text-anchor="middle">下节《多样的文化》见：把这四把尺子带上，继续探索印尼清真文化与巴西本地口味背后的地理故事！</text>
  </g>

  <g id="page-footer" data-pptx-bounds="60 672 1160 28" font-size="14" fill="#64748B">
    <text x="60" y="692">总结深化：素养落地（区域认知 × 综合思维 × 人地协调观 × 地理实践力）</text>
    <text x="1220" y="692" text-anchor="end">第 14 页 / 共 14 页</text>
  </g>
</svg>
