<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei, Arial" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <rect id="deco-top-bar" data-pptx-role="decoration" x="0" y="0" width="1280" height="8" fill="#2563EB"/>

  <g id="page-header" data-pptx-bounds="60 28 1160 76">
    <text x="60" y="66" font-size="33" font-weight="bold" fill="#0F172A">【读图任务 2】“三图叠加”探究：归纳世界人口“四密四疏”</text>
    <text x="60" y="98" font-size="18" fill="#475569">小组将《世界人口分布图》与《世界地形图》《世界气候图》叠置比对，找出背后自然与人文原因</text>
  </g>

  <g id="three-maps-strip" data-pptx-bounds="60 120 1160 172">
    <rect x="60" y="120" width="340" height="132" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>
    <use data-icon="tabler-filled/user" x="80" y="138" width="32" height="32" fill="#1E3A8A"/>
    <text x="122" y="162" font-size="19" font-weight="bold" fill="#1E3A8A">图 1：《世界人口分布图》</text>
    <text x="80" y="198" font-size="15" fill="#334155">【教材原图占位框】找人口密度
      <tspan x="80" dy="24">&gt;100 人/km² 与 &lt;1 人/km² 区域</tspan>
    </text>

    <g id="p07-plus-1" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="mathPlus" data-pptx-frame="414 175 36 36" fill="#1E3A8A" stroke="none">
    <path d="M 418.77 188.77 L 427.77 188.77 L 427.77 179.77 L 436.23 179.77 L 436.23 188.77 L 445.23 188.77 L 445.23 197.23 L 436.23 197.23 L 436.23 206.23 L 427.77 206.23 L 427.77 197.23 L 418.77 197.23 Z"/>
    </g>

    <rect x="464" y="120" width="340" height="132" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>
    <use data-icon="tabler-filled/mountain" x="484" y="138" width="32" height="32" fill="#15803D"/>
    <text x="526" y="162" font-size="19" font-weight="bold" fill="#15803D">图 2：《世界地形图》</text>
    <text x="484" y="198" font-size="15" fill="#334155">【教材原图占位框】比对海拔与地形
      <tspan x="484" dy="24">（沿海平原盆地 vs 高原山地）</tspan>
    </text>

    <g id="p07-plus-2" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="mathPlus" data-pptx-frame="818 175 36 36" fill="#1E3A8A" stroke="none">
    <path d="M 822.77 188.77 L 831.77 188.77 L 831.77 179.77 L 840.23 179.77 L 840.23 188.77 L 849.23 188.77 L 849.23 197.23 L 840.23 197.23 L 840.23 206.23 L 831.77 206.23 L 831.77 197.23 L 822.77 197.23 Z"/>
    </g>

    <rect x="868" y="120" width="352" height="132" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>
    <use data-icon="tabler-filled/sun" x="888" y="138" width="32" height="32" fill="#D97706"/>
    <text x="930" y="162" font-size="19" font-weight="bold" fill="#B45309">图 3：《世界气候图》</text>
    <text x="888" y="198" font-size="15" fill="#334155">【教材原图占位框】比对气温降水
      <tspan x="888" dy="24">（温暖湿润 vs 干 / 热 / 寒极端）</tspan>
    </text>

    <g id="p07-arr-down" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="downArrow" data-pptx-frame="618 260 44 32" fill="#1E3A8A" stroke="none">
    <path d="M 618 276 L 629 276 L 629 260 L 651 260 L 651 276 L 662 276 L 640 292 Z"/>
    </g>
  </g>

  <g id="dense-areas" data-pptx-bounds="60 302 566 248">
    <rect x="60" y="302" width="566" height="248" rx="16" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
    <use data-icon="tabler-filled/circle-check" x="86" y="322" width="34" height="34" fill="#15803D"/>
    <text x="130" y="346" font-size="22" font-weight="bold" fill="#15803D">“四密”稠密区（雪王优先推荐选址）</text>
    <text x="86" y="388" font-size="19" font-weight="bold" fill="#0F172A">① 亚洲东部　② 亚洲南部　③ 欧洲西部　④ 北美洲东部</text>
    <text x="86" y="426" font-size="17" fill="#334155">共同规律：<tspan font-weight="bold" fill="#15803D">中低纬度沿海平原地区</tspan>
      <tspan x="86" dy="30">• 自然条件：地形平坦、气候温暖湿润、水源充足</tspan>
      <tspan x="86" dy="30">• 人文条件：农业发展早（亚洲东/南）、工业与经济</tspan>
      <tspan x="86" dy="26">  发达（欧洲西部、北美东部），交通便利</tspan>
    </text>
  </g>

  <g id="sparse-areas" data-pptx-bounds="654 302 566 248">
    <rect x="654" y="302" width="566" height="248" rx="16" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
    <use data-icon="tabler-filled/alert-triangle" x="680" y="322" width="34" height="34" fill="#DC2626"/>
    <text x="724" y="346" font-size="22" font-weight="bold" fill="#B91C1C">“四疏”稀疏区（雪王否决避坑区）</text>
    <text x="680" y="388" font-size="17" fill="#334155">① <tspan font-weight="bold" fill="#0F172A">极端干旱的沙漠地区</tspan>（如 ③ 撒哈拉沙漠腹地）
      <tspan x="680" dy="32">② <tspan font-weight="bold" fill="#0F172A">气候过于湿热的雨林地区</tspan>（如 ④ 亚马孙雨林深处）</tspan>
      <tspan x="680" dy="32">③ <tspan font-weight="bold" fill="#0F172A">终年严寒的高纬度地区</tspan>（如 ⑥ 北极圈格陵兰）</tspan>
      <tspan x="680" dy="32">④ <tspan font-weight="bold" fill="#0F172A">地势高峻的高原山区</tspan>（如 ⑤ 青藏高原无人区）</tspan>
    </text>
  </g>

  <g id="chase-question" data-pptx-bounds="60 568 1160 88">
    <rect x="60" y="568" width="1160" height="88" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    <use data-icon="tabler-filled/compass" x="86" y="592" width="38" height="38" fill="#1E3A8A"/>
    <text x="138" y="606" font-size="19" font-weight="bold" fill="#1E3A8A">区域认知追问：巴西和美国也是雪王新市场，门店会开在亚马孙雨林里吗？</text>
    <text x="138" y="638" font-size="18" fill="#0F172A">为什么雪王 2025–2026 年选择开在<tspan font-weight="bold" fill="#DC2626">巴西圣保罗</tspan>和<tspan font-weight="bold" fill="#DC2626">美国洛杉矶</tspan>这些沿海平原大城市？</text>
  </g>

  <g id="page-footer" data-pptx-bounds="60 672 1160 28" font-size="14" fill="#64748B">
    <text x="60" y="692">归纳口诀：中低纬沿海平原多稠密（四密）；极干、极湿热、极寒、极高多稀疏（四疏）</text>
    <text x="1220" y="692" text-anchor="end">第 7 页 / 共 13 页</text>
  </g>
</svg>
