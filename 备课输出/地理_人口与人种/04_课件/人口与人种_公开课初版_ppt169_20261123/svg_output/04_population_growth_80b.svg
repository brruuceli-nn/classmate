<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei, Arial" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <rect id="deco-top-bar" data-pptx-role="decoration" x="0" y="0" width="1280" height="8" fill="#1E3A8A"/>

  <g id="page-header" data-pptx-bounds="60 30 1160 80">
    <text x="60" y="70" font-size="33" font-weight="bold" fill="#0F172A">世界人口数量变化：2022 年 11 月 15 日突破 80 亿</text>
    <rect x="945" y="38" width="275" height="38" rx="19" fill="#FEE2E2"/>
    <text x="1082" y="63" font-size="16" font-weight="bold" fill="#B91C1C" text-anchor="middle">小组活动① · 人口增长（5 分钟）</text>
    <text x="60" y="102" font-size="18" fill="#475569">2024 新教材重要锚点：先读懂全球人口总盘子的增长趋势与“大基数”规律</text>
  </g>

  <g id="pop-growth-chart" data-pptx-bounds="60 128 710 520">
    <rect x="60" y="128" width="710" height="520" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="90" y="166" font-size="20" font-weight="bold" fill="#0F172A">世界人口增长示意曲线（1800–2022 年）</text>
    <text x="90" y="192" font-size="15" fill="#64748B">单位：亿人（标注“每增加 10 亿所需年数”）</text>

    <g id="pop-growth-chart-chartArea">
      <line x1="130" y1="215" x2="730" y2="215" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="130" y1="300" x2="730" y2="300" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="130" y1="385" x2="730" y2="385" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="130" y1="470" x2="730" y2="470" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="130" y1="555" x2="730" y2="555" stroke="#64748B" stroke-width="2"/>
      <line x1="130" y1="215" x2="130" y2="555" stroke="#64748B" stroke-width="2"/>

      <text x="118" y="221" font-size="15" fill="#475569" text-anchor="end">80</text>
      <text x="118" y="306" font-size="15" fill="#475569" text-anchor="end">60</text>
      <text x="118" y="391" font-size="15" fill="#475569" text-anchor="end">40</text>
      <text x="118" y="476" font-size="15" fill="#475569" text-anchor="end">20</text>
      <text x="118" y="560" font-size="15" fill="#475569" text-anchor="end">0</text>

      <text x="130" y="582" font-size="15" fill="#475569" text-anchor="middle">1800</text>
      <text x="477" y="582" font-size="15" fill="#475569" text-anchor="middle">1930</text>
      <text x="557" y="582" font-size="15" fill="#475569" text-anchor="middle">1960</text>
      <text x="661" y="582" font-size="15" fill="#475569" text-anchor="middle">1999</text>
      <text x="724" y="582" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="middle">2022</text>

      <!-- chart-plot-area: object=pop-growth-chart | 130,215,730,555 -->
      <path d="M 130 512.5 L 476.7 470 L 556.7 427.5 L 594 385 L 628.7 342.5 L 660.7 300 L 692.7 257.5 L 724.3 215" fill="none" stroke="#1E3A8A" stroke-width="4"/>

      <circle cx="130" cy="512.5" r="6" fill="#1E3A8A"/>
      <circle cx="476.7" cy="470" r="6" fill="#1E3A8A"/>
      <circle cx="556.7" cy="427.5" r="6" fill="#1E3A8A"/>
      <circle cx="594" cy="385" r="6" fill="#1E3A8A"/>
      <circle cx="628.7" cy="342.5" r="6" fill="#1E3A8A"/>
      <circle cx="660.7" cy="300" r="6" fill="#1E3A8A"/>
      <circle cx="692.7" cy="257.5" r="6" fill="#1E3A8A"/>
      <circle cx="724.3" cy="215" r="8" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>

      <text x="142" y="498" font-size="15" font-weight="bold" fill="#1E3A8A">10亿 (1800)</text>
      <text x="305" y="476" font-size="15" fill="#64748B" text-anchor="middle">约130年 →</text>
      <text x="462" y="454" font-size="15" font-weight="bold" fill="#1E3A8A" text-anchor="end">20亿</text>
      <text x="542" y="418" font-size="15" fill="#1E3A8A" text-anchor="end">30亿(30年)</text>
      <text x="580" y="376" font-size="15" fill="#1E3A8A" text-anchor="end">40亿(14年)</text>
      <text x="615" y="334" font-size="15" fill="#1E3A8A" text-anchor="end">50亿(13年)</text>
      <text x="646" y="292" font-size="15" fill="#1E3A8A" text-anchor="end">60亿(12年)</text>
      <text x="678" y="250" font-size="15" fill="#1E3A8A" text-anchor="end">70亿(12年)</text>
      <text x="676" y="216" font-size="18" font-weight="bold" fill="#DC2626" text-anchor="end">80亿 (11年)</text>
    </g>

    <rect x="90" y="598" width="650" height="36" rx="8" fill="#EFF6FF"/>
    <text x="415" y="622" font-size="16" font-weight="bold" fill="#1E3A8A" text-anchor="middle">2022 年 11 月 15 日世界人口达 80 亿（70 亿→80 亿仅用约 11 年）</text>
  </g>

  <g id="group-activity-1" data-pptx-bounds="792 128 428 242">
    <rect x="792" y="128" width="428" height="242" rx="16" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
    <use data-icon="tabler-filled/flag" x="814" y="148" width="34" height="34" fill="#DC2626"/>
    <text x="858" y="172" font-size="20" font-weight="bold" fill="#B91C1C">【小组活动①】算跨度 · 辩“基数”</text>
    <text x="814" y="208" font-size="16" fill="#0F172A">4 人组接力任务（2 分半）：
      <tspan x="814" dy="28">1. <tspan font-weight="bold">浅层接力</tspan>：算每增 10 亿年数，圈出</tspan>
      <tspan x="814" dy="24">   增速最快的阶段（二战后）。</tspan>
      <tspan x="814" dy="28">2. <tspan font-weight="bold" fill="#DC2626">深层思辨</tspan>：近几十年增速已放缓，</tspan>
      <tspan x="814" dy="24">   为何每年净增人口仍高达数千万？</tspan>
      <tspan x="814" dy="28" font-weight="bold" fill="#15803D">→ 提示：对比 10 亿与 80 亿基数！</tspan>
    </text>
  </g>

  <g id="growth-stages" data-pptx-bounds="792 384 428 142">
    <rect x="792" y="384" width="428" height="142" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="814" y="416" font-size="18" font-weight="bold" fill="#1E3A8A">世界人口增长三阶段规律</text>
    <text x="814" y="446" font-size="16" fill="#334155">• 18 世纪以前：增长<tspan font-weight="bold" fill="#0F172A">十分缓慢</tspan>
      <tspan x="814" dy="26">• 18 世纪后（尤其二战后）：<tspan font-weight="bold" fill="#DC2626">大大加快</tspan></tspan>
      <tspan x="814" dy="26">• 近几十年：增速<tspan font-weight="bold" fill="#15803D">放缓</tspan>，但基数庞大</tspan>
    </text>
  </g>

  <g id="textbook-curve-placeholder" data-pptx-bounds="792 540 428 108">
    <rect x="792" y="540" width="428" height="108" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>
    <use data-icon="tabler-filled/photo" x="814" y="558" width="30" height="30" fill="#475569"/>
    <text x="854" y="580" font-size="17" font-weight="bold" fill="#1E3A8A">【教材原图占位示意框】</text>
    <text x="814" y="612" font-size="15" fill="#334155">此处放置：2024 人教版教材《世界人口增长曲线图》
      <tspan x="814" dy="22">与“思与学”栏原图（核对 2022.11.15 达 80 亿）</tspan>
    </text>
  </g>

  <g id="page-footer" data-pptx-bounds="60 672 1160 28" font-size="14" fill="#64748B">
    <text x="60" y="692">活动①落点：用真实曲线数据接力体会“增速变化”与“庞大基数效应”</text>
    <text x="1220" y="692" text-anchor="end">第 4 页 / 共 14 页</text>
  </g>
</svg>
